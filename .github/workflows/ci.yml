name: CI

on:
  push:
    branches: [main]
    # The Apple app has its own workflow (apple.yml).
    paths-ignore:
      - 'apple/**'
      - '.github/workflows/apple.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The packageManager field (bun@x.y.z) pins the version.
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Format check, oxlint (type-aware), typecheck, knip.
      - run: bun run check
      - run: bun run build
      - name: Smoke-test the compiled binary
        run: bun scripts/smoke-binary.ts packages/daemon/dist/phonecode

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: pw
        working-directory: e2e
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      # WebKit runs the Safari smoke project (e2e/tests/webkit.spec.ts).
      - name: Install Chromium and WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: bunx playwright install --with-deps chromium webkit
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: bunx playwright install-deps chromium webkit
      - run: bun run e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  formal:
    name: TLA+ model checking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: formal/.tools
          key: tla-tools-${{ hashFiles('formal/check.sh') }}
      - run: bash formal/check.sh

  tamarin:
    name: Tamarin (attacker model)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            formal/.tools/tamarin-*
            formal/.tools/maude-*
          key: tamarin-tools-${{ hashFiles('formal/tamarin/check.sh') }}
      - run: bash formal/tamarin/check.sh
