name: Formal models

# The TLA+ models of chat sync and pairing and the Tamarin model of pairing and
# authentication: checked when they change, or the protocol and code they model do.
on:
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'packages/protocol/src/**'
      - 'packages/daemon/src/auth/**'
      - 'packages/daemon/src/sessions/event-log.ts'
      - 'packages/daemon/src/sessions/fanout.ts'
      - '.github/workflows/formal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    name: TLA+ model checking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: formal/.tools
          key: tla-tools-${{ hashFiles('formal/check.sh') }}
      - run: bash formal/check.sh

  tamarin:
    name: Tamarin (attacker model)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            formal/.tools/tamarin-*
            formal/.tools/maude-*
          key: tamarin-tools-${{ hashFiles('formal/tamarin/check.sh') }}
      - run: bash formal/tamarin/check.sh
