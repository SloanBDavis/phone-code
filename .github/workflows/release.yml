name: Release

on:
  push:
    tags: ['v*']
  # "Run workflow" on main: releases the version in packages/daemon/package.json
  # and creates its tag at the commit that was built.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        env:
          CI: 'true'
      - name: Work out the release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(bun -e 'console.log(require("./packages/daemon/package.json").version)')" >> "$GITHUB_OUTPUT"
          fi
      # Cross-compiles every target; fails if the tag does not match packages/daemon/package.json.
      - run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: release/npm/*.tgz
          if-no-files-found: error

  # Bun cross-compiles the macOS binaries on Linux, where they cannot be signed, and
  # the signature Bun embeds does not survive on the Intel target. Re-sign both ad hoc
  # on a Mac (Apple Silicon refuses to run a binary without a valid signature).
  sign-macos:
    name: Sign macOS binaries
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Re-sign and repack
        working-directory: release
        run: |
          for target in darwin-arm64 darwin-x64; do
            tar -xzf "phonecode-$target.tar.gz"
            codesign --force --sign - "phonecode-$target/phonecode"
            codesign --verify --verbose=2 "phonecode-$target/phonecode"
            tar -czf "phonecode-$target.tar.gz" "phonecode-$target"
            rm -rf "phonecode-$target"
          done
          shasum -a 256 phonecode-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-signed
          path: |
            release/*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: sign-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: release
      # Exercises install.sh end to end: platform detection, checksum, install, --version.
      - name: Install with install.sh
        run: PHONECODE_BASE_URL="file://$PWD/release" PHONECODE_INSTALL="$RUNNER_TEMP/bin" sh install.sh
      - name: Verify the macOS code signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose=2 "$RUNNER_TEMP/bin/phonecode"
      - name: Pair and run a terminal
        run: bun scripts/smoke-binary.ts "$RUNNER_TEMP/bin/phonecode"

  # The Mac app (apple/), with its own phonecode inside. Ad hoc signed, not notarized:
  # install-app.sh installs it with curl, which macOS does not hold back.
  mac-app:
    name: Build the Mac app
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build and zip PhoneCode.app
        run: apple/scripts/package-mac.sh "$PWD/release-app"
      - name: Install with install-app.sh
        run: |
          PHONECODE_BASE_URL="file://$PWD/release-app" PHONECODE_APP_DIR="$RUNNER_TEMP/Applications" sh install-app.sh
          "$RUNNER_TEMP/Applications/PhoneCode.app/Contents/Helpers/phonecode" --version
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            release-app/PhoneCode-mac.zip
            release-app/PhoneCode-mac.zip.sha256
          if-no-files-found: error

  publish:
    name: Create GitHub release
    # A Mac app that does not build does not hold back the release of phonecode itself.
    needs: [build, smoke, mac-app]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: release
      - uses: actions/download-artifact@v4
        if: needs.mac-app.result == 'success'
        with:
          name: mac-app
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # On a tag push the tag must already exist; on a manual run it is created here.
          if [ "$GITHUB_REF_TYPE" = tag ]; then tagflag="--verify-tag"; else tagflag="--target $GITHUB_SHA"; fi
          app=""
          if [ -f release/PhoneCode-mac.zip ]; then
            app="release/PhoneCode-mac.zip release/PhoneCode-mac.zip.sha256"
          else
            echo "::warning::the Mac app did not build: this release has no PhoneCode-mac.zip"
          fi
          gh release create "$TAG" release/*.tar.gz release/SHA256SUMS $app \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $tagflag $prerelease
