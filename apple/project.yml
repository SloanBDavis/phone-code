# XcodeGen spec for PhoneCode.xcodeproj. The generated project is committed,
# so you only need XcodeGen when you change this file:
#   xcodegen generate --spec apple/project.yml
# CI regenerates it and fails when the committed project is out of date.
# App sources are a synchronized folder: adding a .swift file under
# PhoneCode/ needs no regeneration.
name: PhoneCode
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  projectFormat: xcode16_0
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  PhoneCodeCore:
    path: PhoneCodeCore
    group: ""
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.7"
    CURRENT_PROJECT_VERSION: "9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  PhoneCode:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PhoneCode
        type: syncedFolder
      - path: Config
        buildPhase: none
    postBuildScripts:
      # Mac: compile the phonecode daemon into the app (Contents/Helpers/phonecode).
      - name: Bundle phonecode daemon
        script: '"$SRCROOT/scripts/build-daemon.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: PhoneCodeCore
        product: PhoneCodeCore
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: PhoneCode
        # The daemon build phase reads the repository and runs bun.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(PC_BUNDLE_ID_PREFIX).phonecode
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: phone-code
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSCameraUsageDescription: phone-code uses the camera to scan the pairing QR code your computer shows.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: phone-code connects to phone-code running on your computer.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/PhoneCode-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
  PhoneCodeUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PhoneCodeUITests
        type: syncedFolder
    dependencies:
      - target: PhoneCode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PC_BUNDLE_ID_PREFIX).phonecode.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: PhoneCode
schemes:
  PhoneCode:
    build:
      targets:
        PhoneCode: all
        PhoneCodeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PhoneCodeUITests
    archive:
      config: Release
