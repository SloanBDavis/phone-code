CONSTANTS
    Codes = {c1, c2, c3}
    Devs = {d1, d2}
    Conns = {k1, k2}
    IPs = {i1, i2}
    Fixed = Fixed
    None = None
    HasFixed = FALSE
    MaxActive = 2
    FailIp = 1
    FailGlobal = 2
    MaxRestarts = 2
    FixHandoffRevoke = TRUE
    FixDurableRevoke = FALSE
    FixOfflineRevoke = TRUE
SPECIFICATION Spec
INVARIANTS RevokedStaysRevoked

SYMMETRY Symmetry
