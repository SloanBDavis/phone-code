# Git hooks, installed by `bun install` (the root `prepare` script; skipped in CI).
# Skip once with LEFTHOOK=0 git commit ...
pre-commit:
  parallel: true
  jobs:
    - name: format
      run: bunx oxfmt --check {staged_files}
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,yml,yaml,html}'
    - name: lint
      run: bunx oxlint --type-aware --deny-warnings {staged_files}
      glob: '*.{ts,tsx,js,mjs,cjs}'

# Everything a push must pass, run here: the checks and the end-to-end suite
# (about four minutes). CI only repeats it on main as a backstop.
pre-push:
  jobs:
    - name: test
      run: bun run test
